<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>五百年的守候</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed 3D stage. The interface floats on it as slips of paper at the edges,
   and every chapter opens on a vertical calligraphy card stamped with a red seal (the tung blossom's heart). */
:root {
  color-scheme: light;
  --ink: #1b2624;          /* 墨：帶綠的深墨色 */
  --ink-2: #4a5955;
  --ink-3: #7b8985;
  --paper: #f4f7f2;        /* 桐花白，微帶葉綠 */
  --paper-2: #e6ede6;
  --card: #fbfcf9;
  --glass: rgba(244, 247, 242, 0.92);
  --rule: rgba(27, 38, 36, 0.15);
  --tung: #a8334e;         /* 油桐花心的紅：唯一的強調色 */
  --tung-2: #c9566f;
  --tung-soft: #f5e2e6;
  --leaf: #2d5a49;
  --leaf-soft: #dde9e1;
  --gold: #b5863a;         /* 佛前的金，只在提示與光圈出現 */
  --gold-soft: #f3e6c9;
  --night: #0e1615;
  --night-glass: rgba(12, 19, 18, 0.86);
  --on-night: #eef2ec;
  --on-night-2: #b9c5c0;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif CJK TC", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-ui: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
  --gx-l: max(16px, env(safe-area-inset-left, 0px));
  --gx-r: max(16px, env(safe-area-inset-right, 0px));
  --gy-t: calc(env(safe-area-inset-top, 0px) + 12px);
  --gy-b: calc(env(safe-area-inset-bottom, 0px) + 14px);
  --shadow: 0 14px 36px rgba(12, 19, 18, 0.24), 0 2px 6px rgba(12, 19, 18, 0.12);
}
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(15px, 11px + 0.55vw, 19px); }
body {
  height: 100%; overflow: hidden; background: var(--night); color: var(--ink); -webkit-user-select: none; user-select: none;
  font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible, .opt:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}

/* ---------- 3D stage ---------- */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; transition: filter 2.8s ease; }
#stage.grey { filter: saturate(0.14) brightness(0.92) contrast(0.96); }

/* ---------- effect layer (follows 3D points) ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.edge-arrow {
  position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  display: grid; place-items: center; background: var(--glass); color: var(--gold); box-shadow: 0 4px 14px rgba(12,19,18,.25);
  border: 1.5px solid var(--gold);
}
.edge-arrow svg { width: 24px; height: 24px; }
.hold-ring { position: absolute; left: 0; top: 0; width: 104px; height: 104px; margin: -52px 0 0 -52px; }
.hold-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.hold-ring circle { fill: none; stroke-width: 7; }
.r-track { stroke: rgba(244, 247, 242, 0.55); }
.r-zone { stroke: var(--gold); stroke-width: 11 !important; opacity: .9; }
.r-prog { stroke: var(--paper); stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(0,0,0,.35)); }
.hold-ring.in .r-prog { stroke: var(--tung); }
.float {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); max-width: min(84vw, 24rem); text-align: center; line-height: 1.5;
  font-family: var(--font-display); font-size: 1.08rem; color: var(--ink); background: var(--glass);
  padding: 6px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(12,19,18,.2);
}
.float.warn { color: var(--tung); }
.shard { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.shard svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- full-screen overlays used by single chapters ---------- */
.vignette {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  -webkit-backdrop-filter: blur(7px) saturate(.7); backdrop-filter: blur(7px) saturate(.7);
  -webkit-mask-image: radial-gradient(ellipse 34% 30% at 50% 58%, transparent 55%, #000 100%);
  mask-image: radial-gradient(ellipse 34% 30% at 50% 58%, transparent 55%, #000 100%);
  background: radial-gradient(ellipse 60% 55% at 50% 58%, transparent 50%, rgba(12,19,18,.35) 100%);
}
.train-window { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
.train-window::before {
  content: ""; position: absolute; inset: 9% 7% 12% 7%; border-radius: clamp(18px, 4vw, 44px);
  box-shadow: 0 0 0 100vmax #262b2f, inset 0 0 0 6px #3b4146, inset 0 0 40px rgba(0,0,0,.35);
}
.train-window::after {
  content: ""; position: absolute; inset: 9% 7% 12% 7%; border-radius: clamp(18px, 4vw, 44px);
  background: linear-gradient(115deg, rgba(255,255,255,.10) 0 18%, transparent 18% 60%, rgba(255,255,255,.06) 60% 64%, transparent 64%);
}
.thought {
  position: fixed; z-index: 6; right: var(--gx-r); top: calc(var(--gy-t) + 96px); width: min(15rem, 46vw);
  padding: 12px 14px; display: grid; gap: 6px; justify-items: center; text-align: center; pointer-events: none;
  border-radius: 22px;
}
.thought svg { width: 100%; height: auto; max-height: 9rem; }
.thought p { margin: 0; font-family: var(--font-display); font-size: 1rem; color: var(--ink-2); }

/* ---------- interface layer ---------- */
#ui {
  position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding-left: var(--gx-l); padding-right: var(--gx-r); padding-block: var(--gy-t) var(--gy-b);
  pointer-events: none;
}
#ui button, #ui .caption, #ui input { pointer-events: auto; }
.slip {
  background: var(--glass); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 4px 14px rgba(12, 19, 18, 0.14);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 10px; min-width: 0; }
.hud-left { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.hud-stage { font-family: var(--font-display); font-size: 1.12rem; padding: 5px 14px; }
.hud-ref { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: .78rem; letter-spacing: .06em; color: var(--ink-2); }
.hud-ref svg { width: 15px; height: 15px; flex: none; }
.hud-center { grid-column: 2; grid-row: 1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.meter { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: .78rem; letter-spacing: .08em; color: var(--ink-2); }
.meter-bar { position: relative; width: clamp(84px, 13vw, 160px); height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.meter-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--tung-2)); transition: width .6s ease; }
.meter-bar svg { position: absolute; inset: -2px 0; width: 100%; height: calc(100% + 4px); opacity: 0; transition: opacity .4s; }
.meter.cracked .meter-bar svg { opacity: 1; }
.meter.cracked { color: var(--tung); }
.counter { padding: 6px 12px; font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter b { font-size: 1.06rem; color: var(--tung); font-weight: 700; }
.hud-right { grid-column: 3; grid-row: 1; justify-self: end; display: flex; gap: 8px; }
@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr) auto; }
  .hud-right { grid-column: 2; }
  .hud-center { grid-column: 1 / span 2; grid-row: 2; justify-content: flex-start; }
}
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--glass); color: var(--ink);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.icon-btn svg { width: 22px; height: 22px; }

.mid { display: grid; justify-items: center; align-content: start; gap: 10px; min-height: 0; }
.hint { max-width: min(34rem, 100%); padding: 8px 16px; border-radius: 999px; font-size: .92rem; line-height: 1.5; text-align: center; }
.hearts { display: grid; justify-items: center; gap: 2px; }
.hearts svg { width: clamp(70px, 10vw, 104px); height: auto; overflow: visible; filter: drop-shadow(0 4px 12px rgba(0,0,0,.25)); }
.hearts span { font-size: .8rem; color: var(--on-night); letter-spacing: .1em; text-shadow: 0 1px 6px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
.hearts.whole svg { animation: beat 1.1s ease-in-out 2; }
@keyframes beat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.14); } 55% { transform: scale(.98); } }

.bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
.caption {
  width: 100%; max-width: 44rem; padding: 12px 18px 10px; display: grid; gap: 4px; cursor: pointer;
  border-radius: 14px;
}
.caption-who { font-size: .72rem; letter-spacing: .16em; color: var(--tung); font-weight: 700; }
.caption-text { margin: 0; font-family: var(--font-display); font-size: clamp(1.12rem, .95rem + .6vw, 1.5rem); line-height: 1.6; min-height: 1.6em; text-wrap: pretty; }
.caption-next {
  justify-self: end; display: inline-flex; align-items: center; gap: 6px; padding: 6px 4px 2px 10px; min-height: 36px;
  border: 0; background: none; color: var(--ink-2); font-size: .82rem; letter-spacing: .1em; cursor: pointer;
}
.caption-next::after { content: ""; width: 0; height: 0; border-left: 7px solid var(--tung); border-top: 5px solid transparent; border-bottom: 5px solid transparent; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(3px); } }
.controls { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; min-height: 0; }
.ctl-left, .ctl-right { display: flex; align-items: flex-end; gap: 12px; }

.rooted { display: grid; justify-items: center; gap: 6px; }
.joy {
  position: relative; width: 82px; height: 82px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--rule); box-shadow: 0 4px 14px rgba(12,19,18,.2);
}
.joy svg { width: 62px; height: 62px; }
.joy-label { font-size: .78rem; letter-spacing: .12em; color: var(--on-night); text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.shake { animation: shake .5s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.rustle { display: flex; align-items: flex-end; gap: 12px; }
.gauge { width: clamp(138px, 20vw, 200px); padding: 8px 10px 8px; display: grid; gap: 2px; }
.gauge svg { width: 100%; height: auto; overflow: visible; }
.gauge-row { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; color: var(--ink-2); letter-spacing: .06em; }
.gauge-row b { color: var(--tung); font-variant-numeric: tabular-nums; }
.g-track { fill: none; stroke: var(--paper-2); stroke-width: 9; stroke-linecap: round; }
.g-band { fill: none; stroke: var(--gold); stroke-width: 9; }
.g-needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.round-btn, .rustle-btn {
  width: clamp(92px, 13vw, 124px); height: clamp(92px, 13vw, 124px); border-radius: 50%; cursor: pointer;
  font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .1em;
  border: 3px solid rgba(255,255,255,.7); box-shadow: var(--shadow);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.rustle-btn { background: var(--leaf); color: #eef6f0; }
.rustle-btn.hit { transform: scale(.94); }
.round-btn { background: var(--paper); color: var(--ink); }
.round-btn.down { background: var(--leaf); color: #eef6f0; }
.round-btn-quiet { width: clamp(76px, 10vw, 96px); height: clamp(76px, 10vw, 96px); font-size: 1.05rem; background: var(--glass); }

/* ---------- vertical chapter card ---------- */
.stage-card {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; cursor: pointer;
  background: var(--night-glass); color: var(--on-night);
  padding-left: var(--gx-l); padding-right: var(--gx-r); padding-block: var(--gy-t) var(--gy-b);
  opacity: 0; transition: opacity .7s ease;
}
.stage-card.show { opacity: 1; }
.sc-inner { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: clamp(16px, 4vw, 52px); max-width: 100%; }
.sc-title {
  writing-mode: vertical-rl; white-space: nowrap; margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.3rem, 1.4rem + 4.2vw, 4.8rem); letter-spacing: .2em; line-height: 1.1;
}
.sc-kicker { writing-mode: vertical-rl; white-space: nowrap; font-family: var(--font-display); font-size: clamp(1.05rem, .9rem + .8vw, 1.55rem); letter-spacing: .34em; color: var(--on-night-2); }
.sc-side { display: grid; gap: 12px; max-width: 17rem; align-self: flex-end; justify-items: start; }
.sc-side p { margin: 0; line-height: 1.7; }
.sc-ref { font-size: .82rem; letter-spacing: .12em; color: var(--gold-soft); }
.sc-goal { font-family: var(--font-display); font-size: clamp(1.02rem, .95rem + .4vw, 1.25rem); }
.sc-tap { font-size: .76rem; color: var(--on-night-2); letter-spacing: .12em; }
.seal {
  width: 3.1rem; height: 3.1rem; display: grid; place-items: center; flex: none;
  background: var(--tung); color: #fbeff1; font-family: var(--font-display); font-weight: 700; font-size: 1.55rem;
  border-radius: 7px; box-shadow: inset 0 0 0 3px rgba(251, 239, 241, .55); transform: rotate(-4deg);
}
.seal-sm { width: 2.4rem; height: 2.4rem; font-size: 1.2rem; }

/* ---------- title: a hanging scroll beside the tree ---------- */
.title-screen {
  position: fixed; inset: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto;
  gap: 18px; padding-left: var(--gx-l); padding-right: var(--gx-r); padding-block: calc(var(--gy-t) + 14px) var(--gy-b);
  background: linear-gradient(0deg, rgba(12,19,18,.5) 0%, rgba(12,19,18,0) 36%);
}
.scroll {
  grid-column: 2; grid-row: 1 / span 2; align-self: start; justify-self: end; position: relative; max-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: row-reverse; align-items: flex-start; gap: clamp(8px, 1.4vw, 18px);
  padding: clamp(18px, 3vh, 34px) clamp(16px, 2.2vw, 30px) clamp(16px, 2.6vh, 30px);
  margin-right: clamp(0px, 2vw, 36px);
  color: var(--ink); box-shadow: var(--shadow);
  background: linear-gradient(90deg, rgba(27,38,36,.05), transparent 12%, transparent 88%, rgba(27,38,36,.05)), var(--paper);
}
.scroll::before, .scroll::after {
  content: ""; position: absolute; left: -9px; right: -9px; height: 11px; border-radius: 6px;
  background: linear-gradient(180deg, #5a4535, #34271e); box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
.scroll::before { top: -6px; }
.scroll::after { bottom: -6px; }
.title-main {
  writing-mode: vertical-rl; white-space: nowrap; margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.05;
  font-size: min(clamp(2.3rem, 1.1rem + 4.2vw, 4.7rem), 8.6vh); letter-spacing: .12em;
}
.title-sub { writing-mode: vertical-rl; white-space: nowrap; margin: 2.6em 0 0; font-family: var(--font-display); font-size: min(clamp(1rem, .8rem + .9vw, 1.5rem), 3.4vh); letter-spacing: .3em; color: var(--ink-2); }
.scroll .seal { align-self: flex-end; margin-top: 1.4rem; }
.title-actions { grid-column: 1; grid-row: 2; display: grid; gap: 10px; width: min(23rem, 100%); align-self: end; padding: 14px; border-radius: 14px; }
.title-note { margin: 0 0 2px; color: var(--ink); font-size: .9rem; line-height: 1.7; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 11px 20px;
  border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer;
  font: 500 1rem/1.25 var(--font-ui); letter-spacing: .04em; text-align: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--tung); border-color: var(--tung); color: #fff7f8; }
.btn-lg { min-height: 56px; font-size: 1.12rem; font-family: var(--font-display); letter-spacing: .14em; }
.btn-quiet { background: rgba(244, 247, 242, .86); }
.btn-text { background: transparent; border-color: transparent; color: var(--ink-2); }

/* ---------- sheets (questions, cards, notes) ---------- */
.modal {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  padding-left: var(--gx-l); padding-right: var(--gx-r); padding-block: var(--gy-t) var(--gy-b);
  background: rgba(12, 19, 18, 0.45);
}
.menu { z-index: 45; }
.menu-list { display: grid; gap: 8px; }
.menu-list .btn { justify-content: flex-start; }
.sheet {
  width: 100%; max-width: 40rem; max-height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: grid; gap: 16px; align-content: start; padding: clamp(18px, 3vw, 30px);
  background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: var(--shadow);
  animation: rise .35s ease;
}
.sheet.wide { max-width: 54rem; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet input, .sheet textarea, .sheet p, .sheet li, .sheet td, .poem { -webkit-user-select: text; user-select: text; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: clamp(1.35rem, 1.1rem + 1vw, 1.95rem); line-height: 1.35; text-wrap: balance; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 1.18rem; }
.sheet p { margin: 0; line-height: 1.8; }
.sheet ul, .sheet ol { margin: 0; padding-left: 1.3em; line-height: 1.8; }
.eyebrow { font-size: .74rem; letter-spacing: .18em; color: var(--tung); font-weight: 700; }
.muted { color: var(--ink-2); font-size: .92rem; }
.prompt { font-family: var(--font-display); font-size: clamp(1.12rem, 1rem + .5vw, 1.42rem); line-height: 1.7 !important; }
.options { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink);
  font: 1rem/1.65 var(--font-ui); cursor: pointer; touch-action: manipulation;
}
.opt .k { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); font-weight: 700; font-size: .88rem; }
.opt:disabled { cursor: default; }
.opt.wrong { border-color: var(--tung-2); background: var(--tung-soft); color: var(--ink-2); }
.opt.wrong .k { background: var(--tung-2); color: #fff; }
.opt.right { border-color: var(--leaf); background: var(--leaf-soft); }
.opt.right .k { background: var(--leaf); color: #fff; }
.opt.picked { border-color: var(--tung); box-shadow: inset 0 0 0 1px var(--tung); }
.feedback { padding: 12px 14px; border-radius: 12px; line-height: 1.75; }
.feedback.ok { background: var(--leaf-soft); color: #1b3a2f; }
.feedback.no { background: var(--tung-soft); color: #6c2034; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.actions.spread { justify-content: space-between; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13.5rem), 1fr)); gap: 12px; }
.card {
  position: relative; display: grid; gap: 6px; align-content: start; text-align: left; padding: 16px 16px 18px;
  border-radius: 14px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer;
  font: inherit; touch-action: manipulation;
}

/* ---------- 樹的骨架（遞迴分枝） ---------- */

function makeKeyBuds(tree, viewPos, fwdYaw, n) {

  const cands = tree.tips.map((t, ti) => {
    const wp = t.pos.clone().add(base), d = TMPV.subVectors(wp, viewPos), dist = d.length();
    return { ti, wp, dist, yaw: Math.atan2(-d.x, -d.z), pitch: Math.asin(clamp(d.y / dist, -1, 1)) };
  }).filter(c => c.dist > 1.6 && c.dist < 6.8 && c.pitch > -0.85 && c.pitch < 0.95);
  cands.forEach(c => { c.rel = wrapAngle(c.yaw - fwdYaw); });

  if (cands.length) {
    cands.sort((a, b) => Math.abs(a.rel) - Math.abs(b.rel));
    chosen.push(cands.shift());
    while (chosen.length < n && cands.length) {
      let best = 0, bestScore = -1;
      cands.forEach((c, i) => { const m = Math.min(...chosen.map(h => Math.abs(wrapAngle(h.yaw - c.yaw)))); if (m > bestScore) { bestScore = m; best = i; } });
      chosen.push(cands.splice(best, 1)[0]);
    }
  }

  tree.keyBuds = chosen.map(c => {
    const t = tree.tips[c.ti];
    const toCam = viewPos.clone().sub(base).sub(t.pos).normalize();
    const local = t.pos.clone().addScaledVector(toCam, 1.08 * tree.scale).addScaledVector(UP, 0.1);
    const mesh = new THREE.Mesh(geo, lambert('#e3ebc6', { emissive: new THREE.Color('#2a2c14') }));
    mesh.scale.set(1, 1.35, 1); mesh.position.copy(local);
    const glow = makeGlow('#ffcf6a', 1.6, 0); glow.position.copy(local);
    tree.group.add(mesh, glow);
    const kb = {
      tip: c.ti, local, wpos: local.clone().add(base), mesh, glow, state: 'idle', wob: 0,
      update(time) {
        mesh.visible = this.state !== 'done';
        const target = this.state === 'ready' ? 0.85 + Math.sin(time * 4) * 0.25 : 0;

        glow.visible = glow.material.opacity > 0.01;

      p: p.clone(), v: v ? v.clone() : V3((Math.random() - 0.5) * 0.3, -0.2 - Math.random() * 0.2, (Math.random() - 0.5) * 0.3),
      q: q ? q.clone() : new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, 0)),
      axis: V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(), spin: 1.4 + Math.random() * 2.4,
      s, phase: Math.random() * 6.28, gy: groundAt(p.x, p.z), gt: 0

  }
  update(dt, time) {

      it.p.y += it.v.y * dt;

    TMPM.compose(TMPV.set(it.p.x, it.gy + 0.035, it.p.z), TMPQ, TMPS.setScalar(it.s));

}

/* ===================== 二周目彩蛋：苗栗山間的火車 ===================== */
/* 火車沿 x 軸前進，乘客從右側車窗往外看：出山洞 → 山坡上的油桐樹 → 山丘擋住視線 */
const TRAIN = { built: false, x0: -96, x1: 60, y: 10.2 };
function buildTrain() {
  if (TRAIN.built) return;
  TRAIN.built = true;
  const s = new THREE.Scene(); TRAIN.scene = s;
  s.fog = new THREE.Fog(0xdbe6e1, 60, 520);
  const sky = makeSky(); s.add(sky); TRAIN.sky = sky;
  const m = MOODS.may, u = sky.material.uniforms;
  u.top.value.copy(m.top); u.bot.value.copy(m.bot); u.sunDir.value.copy(m.dir); u.sunCol.value.copy(m.sun); u.sunAmt.value = 0.7;
  s.add(new THREE.HemisphereLight(0xeaf3f6, 0x5e7a4e, 0.74));
  const sun = new THREE.DirectionalLight(0xfff6e4, 0.86); sun.position.copy(m.dir).multiplyScalar(100); s.add(sun);
  s.add(new THREE.AmbientLight(0xffffff, 0.05));

  const TX = 14, TZ = 34;
  const hAt = (x, z) => {
    let h = 7.9;
    if (z > 4) h += (z - 4) * 0.13 + (fbm(x * 0.02, z * 0.02, 41, 4) - 0.45) * 6 * sstep(4, 14, z) + sstep(50, 110, z) * 18;
    else if (z < -4) h += (fbm(x * 0.02, z * 0.02, 43, 3) - 0.5) * 4 - (-4 - z) * 0.05;
    h += 30 * sstep(-50, -57, x) * sstep(4.5, 9, Math.abs(z));            // 山洞所在的山（鐵道兩側是切開的山壁）
    h += 28 * sstep(22, 32, x) * (1 - sstep(16, 30, z)) * sstep(4.5, 8, z); // 轉彎處擋住視線的山丘
    h += 2.2 * Math.exp(-((x - TX) ** 2 + (z - TZ) ** 2) / 60);            // 油桐樹站在一個小坡上
    return h;
  };
  TRAIN.hAt = hAt;
  const g = new THREE.PlaneGeometry(420, 260, 140, 90); g.rotateX(-Math.PI / 2); g.translate(-10, 0, 60);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, hAt(p.getX(i), p.getZ(i)));
  const ng = g.toNonIndexed(); ng.computeVertexNormals();
  const np = ng.attributes.position, nr = ng.attributes.normal, cols = new Float32Array(np.count * 3);
  const pal = ['#5f8c50', '#6c9858', '#56804a', '#7aa564'].map(c => new THREE.Color(c)), rock = new THREE.Color('#7b7a6c'), ballast = new THREE.Color('#857d6e');
  for (let f = 0; f < np.count; f += 3) {
    const cx = (np.getX(f) + np.getX(f + 1) + np.getX(f + 2)) / 3, cz = (np.getZ(f) + np.getZ(f + 1) + np.getZ(f + 2)) / 3;
    const c = TMPC.copy(pal[Math.floor(hash2(Math.floor(cx / 5), Math.floor(cz / 5), 4) * pal.length)]);
    const ny = (nr.getY(f) + nr.getY(f + 1) + nr.getY(f + 2)) / 3;
    if (ny < 0.75) c.lerp(rock, 0.55);
    if (Math.abs(cz) < 3.2) c.copy(ballast);
    c.multiplyScalar(0.95 + hash2(f, 3, 9) * 0.1);
    for (let k = 0; k < 3; k++) cols.set([c.r, c.g, c.b], (f + k) * 3);
  }
  ng.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  s.add(new THREE.Mesh(ng, new THREE.MeshLambertMaterial({ vertexColors: true })));

  /* 山洞：車廂在洞裡時，窗外只看得到洞壁和一盞盞燈 */
  const tunnel = new THREE.Mesh(new THREE.BoxGeometry(70, 6.4, 8), new THREE.MeshBasicMaterial({ color: 0x17140f, side: THREE.BackSide }));
  tunnel.position.set(-90, 11.2, 0); s.add(tunnel);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffd28a });
  for (let x = -122; x < -56; x += 6) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.22, 0.1), lampMat); l.position.set(x, 12.6, 3.9); s.add(l); }
  const stone = lambert('#77726a');
  [[-55, 11.2, -4.6, 1.4, 7.4, 1.6], [-55, 11.2, 4.6, 1.4, 7.4, 1.6], [-55, 15.4, 0, 1.4, 1.6, 10.8]].forEach(([x, y, z, w, h, d]) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stone); b.position.set(x, y, z); s.add(b); });

  /* 鐵道旁的電線桿：一根根閃過，才有速度感 */
  const poleGeo = new THREE.CylinderGeometry(0.1, 0.13, 7.5, 6), poleMat = lambert('#5a4f45'), armGeo = new THREE.BoxGeometry(0.12, 0.12, 1.6);
  for (let x = -50; x < 70; x += 14) {
    const pole = new THREE.Mesh(poleGeo, poleMat); pole.position.set(x, 11.6, 3.4); s.add(pole);
    const arm = new THREE.Mesh(armGeo, poleMat); arm.position.set(x, 14.6, 3.4); s.add(arm);
  }

  /* 山坡上的樹林 */
  const trunkGeo = new THREE.CylinderGeometry(0.14, 0.2, 1.6, 5); trunkGeo.translate(0, 0.8, 0);
  const N = 150, crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), lambert('#ffffff'), N), trunks = new THREE.InstancedMesh(trunkGeo, lambert('#5d544a'), N);
  const R = mulberry(13), greens = ['#4d7a52', '#5c8a5c', '#3f6a4b', '#6a955f'].map(c => new THREE.Color(c));
  let n = 0, guard = 0;
  while (n < N && guard++ < 6000) {
    const x = -60 + R() * 150, z = 7 + Math.pow(R(), 0.8) * 110;
    if (Math.hypot(x - TX, z - TZ) < 12) continue;
    if (z < TZ + 7 && Math.abs(x - TX) < 26) continue;                // 油桐樹前面留一片空地，讓它被看見
    const y = hAt(x, z), sc = 1.5 + R() * 2;
    TMPM.compose(TMPV.set(x, y - 0.2, z), TMPQ.identity(), TMPS.set(sc, sc * 1.2, sc)); trunks.setMatrixAt(n, TMPM);
    TMPE.set(R(), R() * 6, R()); TMPM.compose(TMPV.set(x, y + sc * 1.7, z), TMPQ.setFromEuler(TMPE), TMPS.set(sc * 1.25, sc * 1.1, sc * 1.25)); crowns.setMatrixAt(n, TMPM);
    crowns.setColorAt(n, greens[Math.floor(R() * greens.length)]); n++;
  }
  trunks.count = crowns.count = n; if (crowns.instanceColor) crowns.instanceColor.needsUpdate = true;
  s.add(trunks, crowns);

  TRAIN.tree = buildTungTree({ seed: 31, base: V3(TX, hAt(TX, TZ) - 0.1, TZ), scale: 1.3 });
  TRAIN.tree.setBloomAll(1, true);
  s.add(TRAIN.tree.group);
  TRAIN.treeTop = V3(TX, hAt(TX, TZ) + 6.5, TZ);

  const baseYaw = Math.atan2(-0.36, -0.93);
  TRAIN.place = x => {
    const t = TRAIN.treeTop, yawTree = Math.atan2(-(t.x - x), -(t.z - 0));
    const yaw = baseYaw + clamp(wrapAngle(yawTree - baseYaw) * 0.6, -0.85, 0);
    camera.position.set(x, TRAIN.y, 0);
    camera.rotation.set(0.1, yaw, 0, 'YXZ');
  };
  TRAIN.update = (dt, t) => { sky.position.copy(camera.position); TRAIN.tree.update(dt, t); };
}

/* ===================== 介面元件 ===================== */
const after = (p, fn) => p.then(fn, () => {});
const UPDATERS = new Set();
function onUpdate(fn) { const u = { fn, r: RUN }; UPDATERS.add(u); return () => UPDATERS.delete(u); }
function stepUpdaters(dt) {
  for (const u of UPDATERS) {
    if (u.r.cancelled) { UPDATERS.delete(u); continue; }
    try { u.fn(dt); } catch (err) { console.error(err); }
  }
}

/* 旁白字幕：打字效果，點一下顯示全文，再點一下繼續 */
let captionAdvance = null;
function say(text, opts = {}) {
  return pend(resolve => {
    const box = $('#caption'), tx = $('#caption-text'), who = $('#caption-who');
    who.hidden = !opts.who; who.textContent = opts.who || '';
    box.hidden = false;
    const chars = Array.from(text), instant = REDUCED || AUTO;
    let typed = false, finished = false;
    const finish = () => { if (finished) return; finished = true; captionAdvance = null; resolve(); };
    const complete = () => {
      if (typed) return; typed = true; tx.textContent = text;
      if (opts.auto != null) after(wait(AUTO ? 0.02 : opts.auto), finish);
    };
    tx.textContent = instant ? text : '';
    if (instant) complete();
    else after(tween(Math.min(2.4, chars.length * 0.05), (e, k) => { if (!typed) tx.textContent = chars.slice(0, Math.ceil(k * chars.length)).join(''); }, E.linear), complete);
    captionAdvance = () => { if (!typed) { complete(); return; } finish(); };
    if (AUTO) after(wait(0.03), finish);
  });
}
function hideCaption() { $('#caption').hidden = true; captionAdvance = null; }

/* 章節卡：直書標題＋紅印 */
let stageCardClose = null;

    const t0 = performance.now();

      if (closed) return;
      if (!force && !AUTO && performance.now() - t0 < 900) return;
      closed = true; stageCardClose = null; el.onclick = null;
      el.classList.remove('show');
      setTimeout(() => { if (!el.classList.contains('show')) el.hidden = true; }, 650 / SPEED);
      SND.init();

    const s = openModal(`${o.eyebrow ? `<div class="eyebrow">${esc(o.eyebrow)}</div>` : ''}<h2>${esc(o.title)}</h2>${o.intro ? `<p class="muted">${esc(o.intro)}</p>` : ''}
      <div class="cards">${o.items.map(it => `<button class="card${it.alt ? ' alt' : ''}" type="button" data-k="${esc(it.k)}">${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}<h3>${esc(it.title)}</h3>${it.desc ? `<p>${esc(it.desc)}</p>` : ''}${it.done ? '<span class="done">已完成</span>' : ''}</button>`).join('')}</div>
      ${o.back ? `<div class="actions"><button class="btn btn-text" type="button" data-k="__back">${esc(o.back)}</button></div>` : ''}`, { wide: true });
    s.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { closeModal(); resolve(b.dataset.k); }));
    if (AUTO) setTimeout(() => { const b = s.querySelector(`[data-k="${o.autoPick || o.items[0].k}"]`); if (b) b.click(); }, 30);
  });

/* 過關提問 */
function quiz(q) {
  return pend(resolve => {
    let tries = 0;
    const s = openModal(`<div class="eyebrow">${esc(q.eyebrow)}</div><p class="prompt">${esc(q.prompt)}</p>
      <div class="options" role="group" aria-label="選項">${q.options.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div class="feedback" id="quiz-fb" aria-live="polite" hidden></div>
      <div class="actions"><button class="btn btn-primary" id="quiz-next" type="button" hidden>繼續</button></div>`, { noFocus: true });
    const fb = s.querySelector('#quiz-fb'), next = s.querySelector('#quiz-next');
    s.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      const o = q.options[+btn.dataset.i]; tries++;
      if (o.ok) {
        btn.classList.add('right'); s.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
        fb.className = 'feedback ok'; fb.innerHTML = `<b>${tries === 1 ? '一次就答對！' : '答對了。'}</b>${esc(q.explain)}`; fb.hidden = false;
        if (!(q.id in SAVE.answers)) { SAVE.answers[q.id] = tries === 1; persist(); }
        SND.chime();
        next.hidden = false;
        next.onclick = () => { closeModal(); resolve({ firstTry: tries === 1 }); };
        setTimeout(() => { next.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); next.focus({ preventScroll: true }); }, 60);
        if (AUTO) setTimeout(() => next.click(), 20);
      } else {
        btn.classList.add('wrong'); btn.disabled = true;
        fb.className = 'feedback no'; fb.textContent = o.fb; fb.hidden = false; SND.low();
      }
    }));
    if (AUTO) setTimeout(() => { const b = s.querySelector(`.opt[data-i="${q.options.findIndex(o => o.ok)}"]`); if (b) b.click(); }, 30);
  });
}

/* 跟著 3D 位置飄的字 */
function floatText(text, x, y, cls = '', dur = 3) {
  const el = document.createElement('div');
  el.className = 'float' + (cls ? ' ' + cls : ''); el.textContent = text;
  $('#fx').appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = clamp(x, w / 2 + 12, window.innerWidth - w / 2 - 12) + 'px';
  el.style.top = clamp(y, h + 80, window.innerHeight - h - 20) + 'px';
  const ms = (dur * 1000) / SPEED;
  if (el.animate) {
    const a = el.animate([
      { opacity: 0, transform: 'translate(-50%, -30%)' },
      { opacity: 1, transform: 'translate(-50%, -50%)', offset: 0.12 },
      { opacity: 1, transform: 'translate(-50%, -90%)', offset: 0.78 },
      { opacity: 0, transform: 'translate(-50%, -140%)' }
    ], { duration: ms, easing: 'ease-out' });
    a.onfinish = () => el.remove();
  } else setTimeout(() => el.remove(), ms);
}

/* 畫面邊緣的方向箭頭：目標不在畫面上時指路 */
function pointTo(p) {
  const el = $('#edge-arrow');
  if (!p) { el.hidden = true; return; }
  const sp = toScreen(p);
  if (sp.inView) { el.hidden = true; return; }
  const v = TMPV.copy(p).applyMatrix4(camera.matrixWorldInverse);
  let dx = v.x, dy = -v.y;
  if (v.z > 0) { dx = (Math.sign(v.x) || 1) * Math.max(Math.abs(v.x), Math.abs(v.z)); dy *= 0.3; }
  if (Math.abs(dx) + Math.abs(dy) < 1e-4) dx = 1;
  const Wd = window.innerWidth, Ht = window.innerHeight, cx = Wd / 2, cy = Ht / 2;
  const k = Math.min((cx - 50) / Math.max(1e-4, Math.abs(dx)), (cy - 90) / Math.max(1e-4, Math.abs(dy)));
  el.style.left = (cx + dx * k) + 'px'; el.style.top = (cy + dy * k) + 'px';
  el.firstElementChild.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  el.hidden = false;
}

/* 按住開花的光圈 */
const RING_C = 2 * Math.PI * 40;
function ringShow(x, y) { const r = $('#hold-ring'); r.hidden = false; r.style.left = x + 'px'; r.style.top = y + 'px'; }
function ringSet(prog, a, b) {
  const z = $('#r-zone'), p = $('#r-prog');
  z.style.strokeDasharray = `${RING_C * (b - a)} ${RING_C}`; z.style.strokeDashoffset = `${-RING_C * a}`;
  p.style.strokeDasharray = `${RING_C * clamp(prog, 0, 1)} ${RING_C}`;
  $('#hold-ring').classList.toggle('in', prog >= a && prog <= b);
}
function ringHide() { $('#hold-ring').hidden = true; }

/* 心之碎片：十二片，接住一朵落花補上一片 */
const HEART_PATH = 'M50 88 C 18 66, 2 46, 8 25 C 14 7, 38 3, 50 21 C 62 3, 86 7, 92 25 C 98 46, 82 66, 50 88 Z';
let HEART_TARGETS = [];
function buildHearts() {
  const N = 12, R = mulberry(12), C = [50, 50], rays = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2 + (R() - 0.5) * 0.25, pts = [C.slice()];
    [0.3, 0.62, 1.0, 1.7].forEach((r, k) => { const j = k < 3 ? (R() - 0.5) * 0.24 : 0; pts.push([C[0] + Math.cos(a + j) * r * 52, C[1] + Math.sin(a + j) * r * 52]); });
    rays.push({ a, pts });
  }
  const f = p => p.map(v => v.toFixed(1)).join(',');
  let html = `<defs><clipPath id="hclip"><path d="${HEART_PATH}"/></clipPath></defs><g clip-path="url(#hclip)">`;
  HEART_TARGETS = [];
  for (let i = 0; i < N; i++) {
    const A = rays[i].pts, B = rays[(i + 1) % N].pts;
    const poly = A.concat(B.slice(1).reverse());
    html += `<polygon class="hs" points="${poly.map(f).join(' ')}" fill="rgba(244,247,242,0.3)"/>`;
    let mid = (rays[i].a + rays[(i + 1) % N].a) / 2; if (i === N - 1) mid += Math.PI;
    HEART_TARGETS.push([C[0] + Math.cos(mid) * 24, C[1] + Math.sin(mid) * 24]);
  }
  html += `</g><g clip-path="url(#hclip)" fill="none" stroke="#fbfcf9" stroke-width="1.5" stroke-linejoin="round">${rays.map(r => `<polyline points="${r.pts.map(f).join(' ')}"/>`).join('')}</g><path d="${HEART_PATH}" fill="none" stroke="#fbfcf9" stroke-width="2.4"/>`;
  $('#heart-svg').innerHTML = html;
}
function heartsReset() { buildHearts(); $('#hearts').classList.remove('whole'); heartsCount(0); }
function heartsCount(n) { $('#hearts-count').textContent = `心之碎片　${n} / 12`; }
function heartTargetScreen(i) {
  const r = $('#heart-svg').getBoundingClientRect(), t = HEART_TARGETS[i] || [50, 50];
  return [r.left + ((t[0] + 4) / 108) * r.width, r.top + ((t[1] + 4) / 100) * r.height];
}
function fillShard(i) { const p = $$('#heart-svg .hs')[i]; if (p) p.setAttribute('fill', '#c23a57'); }
function flyShard(x, y, i) {
  const el = document.createElement('div'); el.className = 'shard';
  el.innerHTML = '<svg viewBox="0 0 20 20"><path d="M10 2 L18 9 L11 18 L3 10 Z" fill="#c23a57" stroke="#fbfcf9" stroke-width="1.5"/></svg>';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  $('#fx').appendChild(el);
  const [tx, ty] = heartTargetScreen(i), ms = 700 / SPEED;
  if (el.animate) {
    const a = el.animate([
      { transform: 'translate(0,0) scale(1.6) rotate(0deg)', opacity: 1 },
      { transform: `translate(${(tx - x) * 0.5}px, ${(ty - y) * 0.5 - 60}px) scale(1.2) rotate(140deg)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${tx - x}px, ${ty - y}px) scale(0.6) rotate(300deg)`, opacity: 0.9 }
    ], { duration: ms, easing: 'ease-in-out' });
    a.onfinish = () => { el.remove(); fillShard(i); };
  } else setTimeout(() => { el.remove(); fillShard(i); }, ms);
}

/* 第二幕的顫動計 */
function gaugeSet(rate, lo, hi) {
  const v = r => clamp(r / 6, 0, 1);
  const P = (t, rad) => { const a = Math.PI * (1 - t); return [60 + rad * Math.cos(a), 60 - rad * Math.sin(a)]; };
  const [x1, y1] = P(v(lo), 50), [x2, y2] = P(v(hi), 50), [nx, ny] = P(v(rate), 44);
  $('#g-band').setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} A50 50 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
  const n = $('#g-needle'); n.setAttribute('x2', nx.toFixed(1)); n.setAttribute('y2', ny.toFixed(1));
}

/* 淡入淡出 */
function setFadeNow(v, white) { const f = $('#fade'); f.classList.toggle('white', !!white); f.style.opacity = String(v); }
function fade(to, dur, white) {
  const f = $('#fade');
  if (white != null) f.classList.toggle('white', !!white);
  const from = parseFloat(f.style.opacity || '0');
  return tween(dur, e => { f.style.opacity = String(lerp(from, to, e)); }, E.inOut);
}

function setScene(name) {
  sceneName = name;

}
async function go(name, opts = {}) {
  cancelRun(); hooks.reset(); resetUI();
  STAGE = name; WALK.on = false; LOOKUP = null; JOY_WAIT = null; TAPS.length = 0;
  if (name !== 'prologue') SND.drone(false);
  SND.level(SND.rustle, 0, 0.3);
  if (name !== 'ending' && name !== 'result') SND.level(SND.wind, 0.035, 0.8);
  try { await STAGES[name](opts); }
  catch (e) { if (e !== ABORT) console.error(e); }
}
const next = (name, opts) => { setTimeout(() => go(name, opts), 0); };

function orbitTree(speed = 0.04, r = 19, h = 4.4, start = 0.9, turn = 0, lookY = 4.6) {
  let ang = start;
  const c = W.tree.group.position;
  const place = () => { camera.position.set(c.x + Math.cos(ang) * r, c.y + h, c.z + Math.sin(ang) * r); camera.lookAt(c.x, c.y + lookY, c.z); if (turn) camera.rotateY(turn); };
  place();
  return onUpdate(dt => { ang += dt * speed; place(); });
}

/* 在 3D 場景裡點選目標（記憶碎片、蓮燈） */
function pickTarget(list, radius = 80) {
  return pend(resolve => {
    let done = false;
    const fwd = V3();
    const nearestTo = (x, y, r) => {
      let best = null, bd = r;
      for (const it of list) { const sp = toScreen(it.pos); if (!sp.on) continue; const d = Math.hypot(sp.x - x, sp.y - y); if (d < bd) { bd = d; best = it; } }
      return best;
    };
    const off = onUpdate(() => {
      camera.getWorldDirection(fwd);
      let best = null, ba = Infinity;
      for (const it of list) { const a = TMPV2.subVectors(it.pos, camera.position).normalize().angleTo(fwd); if (a < ba) { ba = a; best = it; } }
      pointTo(best ? best.pos : null);
    });
    const choose = it => { if (done) return; done = true; hooks.tap = null; hooks.key = null; off(); pointTo(null); resolve(it); };
    hooks.tap = (x, y) => { const it = nearestTo(x, y, radius); if (it) choose(it); };
    hooks.key = (k, down) => {
      if (!down || (k !== 'Enter' && k !== ' ')) return false;
      const it = nearestTo(window.innerWidth / 2, window.innerHeight / 2, Math.min(window.innerWidth, window.innerHeight) * 0.35);
      if (it) choose(it);
      return true;
    };
    if (AUTO) after(wait(0.1), () => choose(list[0]));
  });
}

/* ---------- 第一幕：化樹與盛放 ---------- */
const HOLD = { dur: 2.0, a: 0.6, b: 0.88 };
function holdBloom(kb) {
  return pend(resolve => {
    let holding = false, prog = 0;
    const near = (x, y) => { const sp = toScreen(kb.wpos); return sp.on && Math.hypot(sp.x - x, sp.y - y) < 95; };
    const start = () => { holding = true; prog = 0; const sp = toScreen(kb.wpos); ringShow(sp.x, sp.y); ringSet(0, HOLD.a, HOLD.b); SND.tone(440, 0.25, 'sine', 0.04); };
    const cleanup = () => { off(); hooks.down = hooks.up = hooks.key = null; pointTo(null); ringHide(); };
    const release = () => {
      if (!holding) return;
      holding = false; ringHide();
      const sp = toScreen(kb.wpos);
      if (prog < HOLD.a) { kb.wob = 1; SAVE.early++; SND.low(); floatText('太急了，花苞還沒準備好。', sp.x, sp.y - 80, 'warn', 2.4); }
      else { cleanup(); resolve('perfect'); }
    };
    hooks.down = (x, y) => { if (near(x, y)) { start(); return true; } return false; };
    hooks.up = () => release();
    hooks.key = (k, down) => {
      if (k !== ' ' && k !== 'Enter') return false;
      if (down && !holding) { if (toScreen(kb.wpos).inView) start(); else hint('先轉動視角，讓發光的花苞出現在畫面上。', 3); }
      else if (!down) release();
      return true;
    };
    const off = onUpdate(dt => {
      pointTo(kb.wpos);
      if (!holding) return;
      prog += dt / HOLD.dur;
      const sp = toScreen(kb.wpos); ringShow(sp.x, sp.y); ringSet(prog, HOLD.a, HOLD.b);
      if (prog >= 1) { holding = false; ringHide(); SAVE.late++; kb.wob = 0.6; SND.low(); floatText('猶豫太久，陽光移走了。再試一次。', sp.x, sp.y - 80, 'warn', 2.6); }
      else if (prog > HOLD.b && prog - dt / HOLD.dur <= HOLD.b) { /* 剛離開金色區段 */ }
    });
    if (AUTO) after(wait(0.1), () => { cleanup(); resolve('perfect'); });
  });
}
function wishCard() {
  return pend(resolve => {
    const s = openModal(`<div class="eyebrow">最後一個花苞</div><h2>寫下你自己的盼望</h2>
      <p class="muted">這朵花開的時候，會浮現你寫的這句話。也可以直接讓它開。</p>
      <div class="field"><label for="wish-input">我的盼望（20 字以內）</label><input class="input" id="wish-input" maxlength="24" autocomplete="off" placeholder="例如：願你經過時，放慢一點腳步" value="${esc(SAVE.wish)}"></div>
      <div class="actions"><button class="btn btn-text" id="wish-skip" type="button">直接開花</button><button class="btn btn-primary" id="wish-ok" type="button">寫好了</button></div>`);
    const inp = s.querySelector('#wish-input');
    const done = keep => { if (keep) { SAVE.wish = inp.value.trim(); persist(); } closeModal(); resolve(); };
    s.querySelector('#wish-ok').onclick = () => done(true);
    s.querySelector('#wish-skip').onclick = () => done(false);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) done(true); });
    if (AUTO) setTimeout(() => { inp.value = '願你經過時，放慢一點腳步'; done(true); }, 30);
  });
}

function rustleTap() {
  TAPS.push(performance.now());
  const b = $('#btn-rustle'); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 90);
  if (SND.ctx) SND.tone(1800 + Math.random() * 600, 0.08, 'triangle', 0.015);

STAGES.act2 = async () => {
  setScene('world');
  const uStart = U_TREE - 74 / PATH_LEN;
  resetWorld({ mood: 'afternoon', traveler: true, travelerU: uStart, pose: 'read', near: 1.5 });
  setFadeNow(1);
  setLook(TREE_CAM, TREE_FWD); LOOK.on = true;
  fade(0, 1.2);
  await stageCard({ seal: '貳', kicker: '第二幕', title: '微風的訊號', ref: '對照課文　第三段（他走近時）', goal: '他正一步步走近。讓葉子顫動，讓他聽見你。' });
  showHUD('第二幕・微風的訊號', '第三段・他走近時'); setMeter(85);
  const T = W.trav, dist = () => Math.max(0, (U_TREE - T.u) * PATH_LEN);
  T.onStep = () => SND.step(clamp(0.16 - dist() * 0.0019, 0.012, 0.16));
  await say('遠處，傳來了腳步聲。');
  T.speed = 2.3;
  await say('是他。', { auto: 1.2 });
  hideCaption();
  $('#rustle').hidden = false;
  hint('連續點「沙沙」讓葉子顫動。他越走越近，節奏要越來越快：讓指針停在金色區段。', 9);
  hooks.key = (k, down) => { if (k === ' ' && down) { rustleTap(); return true; } return false; };
  const total = (U_TREE - uStart) * PATH_LEN;
  let inBand = 0, active = 0;
  const off = onUpdate(dt => {
    const remain = dist(), prog = 1 - remain / total;
    const center = 1.4 + 2.6 * prog, lo = center - 0.75, hi = center + 0.75;
    const now = performance.now();
    while (TAPS.length && now - TAPS[0] > 1600) TAPS.shift();
    const rate = AUTO ? center : TAPS.length / 1.6;
    const ok = rate >= lo && rate <= hi;
    active += dt; if (ok) inBand += dt;
    W.tree.tremble = lerp(W.tree.tremble, clamp(rate / 5, 0, 1.15), Math.min(1, dt * 6));
    SND.level(SND.rustle, clamp(W.tree.tremble * 0.3, 0, 0.34), 0.08);
    LOOK.tzoom = ok ? 0.86 : 1;
    LOOK.shake = W.tree.tremble > 0.55 ? (W.tree.tremble - 0.55) * 2 : 0;
    gaugeSet(rate, lo, hi);

/* ===================== 主程式：輸入、迴圈、啟動 ===================== */
const PTR = { id: null, x0: 0, y0: 0, x: 0, y: 0, t0: 0, moved: false, captured: false };
const KEYS = new Set();
let MENU_EL = null;

function bindInput() {
  const cv = $('#stage');
  cv.addEventListener('pointerdown', e => {
    if (PTR.id !== null) return;
    PTR.id = e.pointerId; PTR.x0 = PTR.x = e.clientX; PTR.y0 = PTR.y = e.clientY; PTR.t0 = performance.now(); PTR.moved = false;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 舊瀏覽器 */ }
    PTR.captured = hooks.down ? !!hooks.down(e.clientX, e.clientY) : false;
    SND.init();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== PTR.id) return;
    const dx = e.clientX - PTR.x, dy = e.clientY - PTR.y;
    PTR.x = e.clientX; PTR.y = e.clientY;
    if (!PTR.moved && Math.hypot(PTR.x - PTR.x0, PTR.y - PTR.y0) > 8) PTR.moved = true;
    if (LOOK.on && !PTR.captured && PTR.moved) {
      const sens = (Math.PI * 1.1) / Math.max(window.innerWidth, window.innerHeight);
      LOOK.ty += dx * sens; LOOK.tp = clamp(LOOK.tp + dy * sens, LOOK.minP, LOOK.maxP);
    }
  });
  cv.addEventListener('pointerup', e => {
    if (e.pointerId !== PTR.id) return;
    const was = PTR.captured; PTR.id = null; PTR.captured = false;
    if (was) { if (hooks.up) hooks.up(); return; }
    if (!PTR.moved && performance.now() - PTR.t0 < 500) { if (hooks.tap) hooks.tap(e.clientX, e.clientY); else if (captionAdvance) captionAdvance(); }
  });
  cv.addEventListener('pointercancel', e => {
    if (e.pointerId !== PTR.id) return;
    const was = PTR.captured; PTR.id = null; PTR.captured = false;
    if (was && hooks.up) hooks.up();
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName, k = e.key;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!MENU_EL.hidden) { if (k === 'Escape') closeMenu(); return; }
    if (!$('#modal').hidden) return;
    if (tag === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
    if (k === 'Escape' && STAGE !== 'title') { showMenu(); return; }
    if (stageCardClose && (k === 'Enter' || k === ' ')) { e.preventDefault(); stageCardClose(true); return; }
    if (captionAdvance && (k === 'Enter' || k === ' ')) { e.preventDefault(); if (!e.repeat) captionAdvance(); return; }
    if (e.repeat) { if (k.indexOf('Arrow') === 0 || k === ' ') e.preventDefault(); return; }
    if (hooks.key && hooks.key(k, true)) { e.preventDefault(); return; }
    const lk = k.toLowerCase();
    if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w'].indexOf(lk) >= 0) {
      KEYS.add(lk); e.preventDefault();
      if ((lk === 'arrowup' || lk === 'w') && !$('#btn-walk').hidden) WALK.on = true;
    }
  });
  window.addEventListener('keyup', e => {
    const lk = e.key.toLowerCase();
    KEYS.delete(lk);
    if (lk === 'arrowup' || lk === 'w') WALK.on = false;
    if (hooks.key) hooks.key(e.key, false);
  });
  window.addEventListener('blur', () => { KEYS.clear(); WALK.on = false; });
}

function syncSoundBtn() {
  const m = !!SAVE.muted;
  $$('#btn-sound .snd-on').forEach(p => { p.style.display = m ? 'none' : ''; });

  wb.addEventListener('pointerup', walkOff); wb.addEventListener('pointercancel', walkOff); wb.addEventListener('lostpointercapture', walkOff);

  $('#btn-lookup').addEventListener('click', () => { if (LOOKUP) LOOKUP(); });
  $('#btn-start').addEventListener('click', () => { SND.init(); SND.setMuted(!!SAVE.muted); go('prologue'); });

  MENU_EL.addEventListener('click', e => { if (e.target === MENU_EL) closeMenu(); });
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => {
    if (!SND.ctx) return;
    if (document.hidden) SND.ctx.suspend(); else SND.ctx.resume();
  });
}

let LAST = 0, FRAME_ERR = false, FRAMES = 0, NO_RENDER = false;
function frame(now) {
  requestAnimationFrame(frame);
  FRAMES++;
  let dt = LAST ? Math.min(0.05, (now - LAST) / 1000) : 0.016;
  LAST = now;
  if (MENU_EL.hidden) {
    dt *= SPEED;
    W.time += dt;
    stepTweens(dt); stepWaiters(); stepUpdaters(dt);
    if (KEYS.size && LOOK.on) {
      if (KEYS.has('arrowleft')) LOOK.ty += dt * 1.7;
      if (KEYS.has('arrowright')) LOOK.ty -= dt * 1.7;
      if (KEYS.has('arrowup')) LOOK.tp = clamp(LOOK.tp + dt * 1.2, LOOK.minP, LOOK.maxP);
      if (KEYS.has('arrowdown')) LOOK.tp = clamp(LOOK.tp - dt * 1.2, LOOK.minP, LOOK.maxP);
    }
    try {
      if (sceneName === 'world') updateWorld(dt * W.timeScale, W.time);
      else if (sceneName === 'temple') TEMPLE.update(dt, W.time);
      else if (sceneName === 'train' && TRAIN.update) TRAIN.update(dt, W.time);
    } catch (err) { if (!FRAME_ERR) { FRAME_ERR = true; console.error(err); } }
    updateLook(dt);
  }
  camera.updateMatrixWorld();
  if (activeScene && !NO_RENDER) renderer.render(activeScene, camera);
}

function fatal(msg) { const f = $('#fatal'); f.innerHTML = `<p>${esc(msg)}</p>`; f.hidden = false; }
function start(data) {
  loadSave();
  if (data && data.save) SAVE = Object.assign(blankSave(), data.save);
  SND.muted = !!SAVE.muted;
  syncSoundBtn();
  bindUI();
  if (!window.THREE) { fatal('3D 引擎沒有載入成功。請確認網路連線，再重新整理頁面。'); return; }
  initThreeGlobals();
  try { initRenderer(); } catch (e) { fatal('這台裝置的瀏覽器無法顯示 3D 畫面（WebGL）。請改用較新版的 Safari 或 Chrome 再試一次。'); return; }
  setTimeout(() => {
    try { buildWorld(); buildTemple(); buildHearts(); }
    catch (e) { console.error(e); fatal('畫面建立時發生問題，請重新整理頁面。'); return; }
    bindInput();
    setScene('world'); applyFov(true);
    requestAnimationFrame(frame);
    go('title');
    const b = $('#btn-start'); b.disabled = false; b.textContent = '開始遊戲';
  }, 30);
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: SAVE })); } catch (e) { /* 非 Claude 檢視器 */ }
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
/* 只在本機檔案測試時開放的除錯介面；發布後的頁面不會有 */
if (location.protocol === 'file:') window.__wbn = {
  go, auto(v, speed) { AUTO = !!v; SPEED = speed || 1; }, stage: () => STAGE, save: () => SAVE,
  frames: () => FRAMES,
  noRender(v) { NO_RENDER = !!v; },
  grab(q) { camera.updateMatrixWorld(); renderer.render(activeScene, camera); return renderer.domElement.toDataURL('image/jpeg', q || 0.82); },
  debug: () => ({
    W, camera, LOOK, TEMPLE, TRAIN, TREE, TREE_CAM, TREE_FWD, TREE_BASE, U_TREE, U_FAR, PATH, PATH_LEN, V3, NEAR, yawPitch,

  })
};
